name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (typecheck, migrations, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khidma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khidma_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khidma_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (also generates the Prisma client)
        run: npm ci

      - name: Check migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile app (typecheck, lint, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes a contract test that reads server/src and fails if the API can return an
      # error code the app has no Arabic/English message for.
      - name: Test
        run: npm test -- --ci

      - name: Bundle (catches broken imports that tests don't reach)
        run: npx expo export --platform web
